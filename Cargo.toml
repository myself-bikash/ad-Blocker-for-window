[workspace]
members = [
  "crates/core",
  "crates/rules",
  "crates/dns",
  "crates/network",
  "crates/wfp",
  "crates/service",
  "crates/updater",
  "crates/config",
  "crates/diagnostics",
  "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["AdBlocker Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
windows-service = "0.6"


