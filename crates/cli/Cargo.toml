[package]
name = "adblock-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "adblockctl"
path = "src/main.rs"

[dependencies]
adblock-core = { path = "../core" }
adblock-service = { path = "../service" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
